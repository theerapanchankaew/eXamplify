# eXamplify — self-hosted stack for a single VM.
#
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build
#
# Services: db (PostgreSQL) · app (Next.js) · proxy (Caddy, HTTPS) · backup (daily pg_dump)
# One-off tools:  docker compose run --rm tools create-admin -- admin@example.org
# Full guide: docs/DEPLOYMENT.md

name: examplify

x-database-url: &database-url
  DATABASE_URL: postgres://examplify:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/examplify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: examplify
      POSTGRES_USER: examplify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examplify -d examplify"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build:
      context: .
      target: runner
    image: examplify-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      TLS_MODE: ${TLS_MODE:-auto}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: examplify
      PGDATABASE: examplify
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # One-off administration (not started by `up`):
  #   docker compose run --rm tools create-admin -- admin@example.org
  #   docker compose run --rm tools migrate:firebase -- --credentials /secrets/service-account.json
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    image: examplify-tools:latest
    env_file: .env
    environment:
      <<: *database-url
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]   # frontend gives internet access (Firebase migration)

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
